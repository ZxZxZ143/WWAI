<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Қолдау</title>
  <link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/favicon/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/brand/app-icons/qoldau-app-icon-180.png">
  <meta name="theme-color" content="#FFF5F0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/kit.css">
  <link rel="stylesheet" href="/mascot.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/screens.css">
</head>
<body>
  <div class="app q-root">
    <header class="bar">
      <a class="brand" href="#/today" aria-label="Қолдау, на главную">
        <img class="brand__logo" src="/brand/svg/qoldau-logo-horizontal.svg" alt="Qoldau" width="140" height="44">
      </a>
      <nav class="nav" aria-label="Разделы">
        <a href="#/today" data-nav="today" title="Сегодня"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="nav__label">Сегодня</span></a>
        <a href="#/supports" data-nav="supports" title="Мои опоры"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span class="nav__label">Мои опоры</span></a>
        <a href="#/plan" data-nav="plan" title="Мой план"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg><span class="nav__label">Мой план</span></a>
        <a href="#/history" data-nav="history" title="История и консультации"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="nav__label">История и консультации</span></a>
        <a href="#/data" data-nav="data" title="Мои данные"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span class="nav__label">Мои данные</span></a>
        <a href="#/profile" data-nav="profile" title="Профиль"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span class="nav__label">Профиль</span></a>
      </nav>
      <div class="switcher">
        <label class="sr-only" for="profileSelect">Профиль</label><select id="profileSelect"></select>
        <label class="sr-only" for="dateSelect">День</label><input type="date" id="dateSelect">
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="foot">
      <p>Қолдау не ставит диагнозов и не меняет лечение.</p>
    </footer>
  </div>
  <dialog class="sheet q-root" id="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/mascot.js"></script>
  <script src="/app.js"></script>
</body>
</html>
